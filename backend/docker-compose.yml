services:
  postgres:
    image: postgres:16
    container_name: medirisk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medirisk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medirisk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
