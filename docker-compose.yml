services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: pharmalogs-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-pharmalogs}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d pharmalogs" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pharmalogs-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmalogs-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override .env for Docker networking
      DB_HOST: postgres
      DB_PORT: 5432
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      FRONTEND_URL: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pharmalogs-network
    command: >
      sh -c "echo 'Waiting for PostgreSQL...' &&
             sleep 5 &&
             node dist/index.js"

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: pharmalogs-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - pharmalogs-network

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pharmalogs-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pharmalogs.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pharmalogs-network

volumes:
  postgres_data:


networks:
  pharmalogs-network:
    driver: bridge
